version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: farewell_db
    env_file: ./db/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farewell_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farewell_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: farewell_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farewell_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farewell_backend
    env_file: ./backend/.env
    environment:
      DJANGO_SUPERUSER_EMAIL: bu.admin@gmail.com
      DJANGO_SUPERUSER_PASSWORD: Alamin@123
      DJANGO_SUPERUSER_USERNAME: admin
    volumes:
      - ./backend:/app/backend
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farewell_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend_fw
      dockerfile: Dockerfile
    container_name: farewell_frontend
    env_file: ./frontend_fw/.env
    volumes:
      - ./frontend_fw:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - farewell_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: farewell_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/backend/staticfiles:ro
      - media_volume:/app/backend/media:ro
    ports:
      - "90:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - farewell_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  farewell_network:
    driver: bridge
